<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>disorder</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Archivo:wght@700..900&family=Space+Mono:wght@400;700&family=Oi&display=swap">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Pastas">
    <div class="brand"><b>disorder</b></div>
    <nav class="nav" id="nav"></nav>
    <p class="foot" id="foot"></p>
  </aside>

  <main class="main">
    <div id="banner"></div>

    <section aria-labelledby="view-title">
      <div class="head" id="head"></div>
      <div class="banner inline clip" id="clip" role="status" hidden></div>
      <div class="tools" id="tools" style="margin-top:24px"></div>
      <div class="list" id="list" style="margin-top:14px"></div>
    </section>
  </main>
</div>

<div class="overlay" id="add-root" data-add="overlay" hidden>
  <form class="modal add" id="capture" role="dialog" aria-modal="true" aria-labelledby="add-title" novalidate>
    <div class="mhead"><h2 id="add-title">Salvar link</h2><button type="button" class="btn icon ghost" data-add="close" aria-label="Fechar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div>
    <div class="field">
      <span class="detected" id="detected" hidden></span>
      <label class="sr" for="url">Link para salvar</label>
      <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cole o link aqui">
      <button class="btn outline sm" type="button" id="paste">Colar</button>
    </div>
    <p class="hint">X, Threads, Instagram, TikTok e YouTube. Pode colar vários de uma vez.</p>
    <label class="f">Pasta<select class="sel" id="dest"></select></label>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <div class="row"><span class="kbd-hint">Dica: cole um link em qualquer lugar da página para salvar direto.</span><button type="button" class="btn outline" data-add="close">Cancelar</button><button class="btn primary" type="submit" id="save" disabled>Salvar</button></div>
  </form>
</div>
<div id="modal-root"></div>
<button type="button" class="fab" data-act="open-add" aria-label="Salvar link"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
<div class="bar" id="bar" role="toolbar" aria-label="Ações para os links selecionados" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
