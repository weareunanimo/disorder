<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brica-braca</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Pastas">
    <div class="brand"><b>brica-braca</b></div>
    <nav class="nav" id="nav"></nav>
    <p class="foot" id="foot"></p>
  </aside>

  <main class="main">
    <form class="capture" id="capture" novalidate>
      <div><h2>Salvar um link</h2><p class="msg" style="color:var(--muted-fg);min-height:0">Aceita X, Threads, Instagram, TikTok e YouTube (vídeos e Shorts).</p></div>
      <div class="field">
        <span class="detected" id="detected" hidden></span>
        <label class="sr" for="url">Link para salvar</label>
        <input id="url" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cole um link aqui">
        <button class="btn primary" type="submit" id="save" hidden>Salvar</button>
        <button class="btn outline" type="button" id="paste">Colar</button>
      </div>
      <div class="banner inline" id="clip" role="status" hidden></div>
      <div class="cap-row">
        <label for="dest">Guardar em</label>
        <select class="sel" id="dest"></select>
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>

    <div id="banner"></div>

    <section aria-labelledby="view-title">
      <div class="head" id="head"></div>
      <div class="tools" id="tools" style="margin-top:14px"></div>
      <div class="bulk" id="bulk" hidden></div>
      <div class="list" id="list" style="margin-top:14px"></div>
    </section>
  </main>
</div>

<div id="modal-root"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
